[project]
name = "prime-agent-skill-ados"
version = "0.1.0"
description = "ADOS governed-capability bridge for the Prime Agent kernel"
requires-python = ">=3.10"
dependencies = ["mcp", "httpx", "prime-agent-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ados"]
