[tool.pytest.ini_options]
# Shared root config — covers backend/tests as well as any tests added
# under agents/ or knowledge/ for the Phase 2 work happening in parallel.
pythonpath = ["."]
asyncio_mode = "auto"
# `external` tests MUTATE a real third-party system. They are deselected by
# default so that `pytest` — in CI, in a hook, on a laptop — can never create
# real records as a side effect of running the suite. Run them deliberately:
#
#     pytest -m external
#
# A test that writes to someone's ServiceNow instance should require you to
# have typed the words "external" first.
#
# `docker` tests build real networks and containers to prove the runtime's
# egress boundary from inside it. They need Docker and the runtime images, and
# take ~30s, so a laptop or CI job running plain `pytest` should not be
# required to have them. Run deliberately:
#
#     pytest -m docker
#
addopts = "-m 'not external and not docker'"
markers = [
    "external: mutates a real external system (ServiceNow). Deselected by default.",
    "docker: builds real containers/networks to prove the egress boundary. Deselected by default.",
]
